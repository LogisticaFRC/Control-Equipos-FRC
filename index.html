<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ config.title }}</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- SheetJS CDN (Excel) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* Efecto parpadeo lento rojo para equipos PASADOS */
    @keyframes blink-red-slow {
      0% { background-color: #450a0a; border-color: #ef4444; }
      50% { background-color: #991b1b; border-color: #fca5a5; }
      100% { background-color: #450a0a; border-color: #ef4444; }
    }
    .bg-pasado-blink {
      animation: blink-red-slow 2.5s ease-in-out infinite;
      color: white;
    }
    .bg-normal-horometro {
      background-color: #0f172a; /* slate-900 */
      border-color: #334155; /* slate-700 */
      color: white;
    }
    
    /* Scrollbar minimalista para tablas y paneles */
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body :style="bodyStyle" class="font-sans min-h-screen flex flex-col transition-colors duration-300">

  <div id="app" class="flex-grow flex flex-col">

    <!-- MENÚ DE INICIO / ACCESO POR CREDENCIALES -->
    <div v-if="!usuarioActivo" class="min-h-screen flex items-center justify-center bg-slate-900 p-4 w-full flex-grow">
      <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-md p-8 space-y-6 text-center">
        
        <div class="flex justify-center">
          <div class="bg-slate-900 p-3 rounded-2xl w-28 h-28 flex items-center justify-center border border-slate-700 shadow-xl">
            <img :src="config.logo" alt="Logo Empresa" class="max-h-full max-w-full object-contain">
          </div>
        </div>

        <div>
          <h2 class="text-xl font-extrabold text-slate-800 tracking-tight">{{ config.title }}</h2>
          <p class="text-xs text-slate-500 mt-1 font-semibold">{{ config.subtitle }}</p>
        </div>

        <form @submit.prevent="login" class="space-y-4 text-left text-xs">
          <div>
            <label class="font-bold text-slate-700 block mb-1">Usuario</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                <i class="fa-solid fa-user"></i>
              </span>
              <input type="text" v-model="loginUser" placeholder="Ingresa tu usuario..." required class="w-full pl-10 pr-3 py-3 border border-slate-300 rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-amber-500 font-semibold text-slate-800 outline-none">
            </div>
          </div>

          <div>
            <label class="font-bold text-slate-700 block mb-1">Contraseña</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                <i class="fa-solid fa-lock"></i>
              </span>
              <input type="password" v-model="loginPass" placeholder="Ingresa tu contraseña..." required class="w-full pl-10 pr-3 py-3 border border-slate-300 rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-amber-500 font-semibold text-slate-800 outline-none">
            </div>
          </div>
          
          <p v-if="authError" class="text-rose-600 font-bold text-center bg-rose-50 p-3 rounded-xl border border-rose-200 text-xs">
            <i class="fa-solid fa-triangle-exclamation mr-1"></i> Usuario o contraseña incorrectos
          </p>

          <button type="submit" :style="primaryBtnStyle" class="w-full font-extrabold py-3.5 rounded-xl shadow-lg hover:brightness-110 transition flex items-center justify-center gap-2 text-sm uppercase tracking-wider">
            <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
          </button>
        </form>

        <div class="text-[11px] text-slate-400 font-medium">
          Acceso protegido - Sistema Operativo FRC
        </div>

      </div>
    </div>

    <!-- PANEL PRINCIPAL -->
    <template v-else>

      <header :style="headerStyle" class="text-white shadow-lg sticky top-0 z-40 transition-colors duration-300">
        <div class="max-w-[1400px] mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
          
          <div class="flex items-center gap-3">
            <div class="bg-white p-1 rounded-lg w-12 h-12 flex items-center justify-center overflow-hidden border border-slate-700 shadow-sm">
              <img :src="config.logo" alt="Logo Empresa" class="max-h-full max-w-full object-contain">
            </div>
            <div>
              <h1 class="font-bold text-lg leading-tight">{{ config.title }}</h1>
              <p class="text-xs text-slate-300 opacity-90">{{ config.subtitle }}</p>
            </div>
          </div>

          <nav class="flex items-center gap-1.5 overflow-x-auto py-1">
            <button @click="switchTab('dashboard')" :class="['px-3 py-1.5 rounded-md text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap', currentTab === 'dashboard' ? 'bg-white/20 text-white shadow' : 'hover:bg-white/10 text-slate-200']">
              <i class="fa-solid fa-chart-line"></i> Dashboard
            </button>
            <button @click="switchTab('inventario')" :class="['px-3 py-1.5 rounded-md text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap', currentTab === 'inventario' ? 'bg-white/20 text-white shadow' : 'hover:bg-white/10 text-slate-200']">
              <i class="fa-solid fa-boxes-stacked"></i> Inventario AFI ({{ dbEquipos.length }})
            </button>
            <button @click="switchTab('programas')" :class="['px-3 py-1.5 rounded-md text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap', currentTab === 'programas' ? 'bg-rose-500 text-white shadow' : 'hover:bg-white/10 text-slate-200']">
              <i class="fa-solid fa-calendar-check"></i> Programas
            </button>
            <button @click="switchTab('movimientos')" :class="['px-3 py-1.5 rounded-md text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap', currentTab === 'movimientos' ? 'bg-white/20 text-white shadow' : 'hover:bg-white/10 text-slate-200']">
              <i class="fa-solid fa-truck-ramp-box"></i> Movimientos ({{ dbMovimientos.length }})
            </button>
            <button @click="switchTab('hojaVida')" :class="['px-3 py-1.5 rounded-md text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap', currentTab === 'hojaVida' ? 'bg-white/20 text-white shadow' : 'hover:bg-white/10 text-slate-200']">
              <i class="fa-solid fa-file-medical"></i> Historial ({{ dbIntervenciones.length }})
            </button>
            <button @click="switchTab('aceites')" :class="['px-3 py-1.5 rounded-md text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap', currentTab === 'aceites' ? 'bg-white/20 text-white shadow' : 'hover:bg-white/10 text-slate-200']">
              <i class="fa-solid fa-oil-can"></i> Control Aceites
            </button>
            <button @click="switchTab('configuracion')" :class="['px-3 py-1.5 rounded-md text-xs font-bold transition flex items-center gap-1.5 whitespace-nowrap', currentTab === 'configuracion' ? 'bg-white/20 text-white shadow' : 'hover:bg-white/10 text-slate-200']">
              <i class="fa-solid fa-gear"></i> Config & Usuarios
            </button>
          </nav>

          <div class="flex items-center gap-3">
            <button v-if="isAdmin" @click="abrirFormularioNuevaMantencion()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow-md">
              <i class="fa-solid fa-plus-circle text-sm"></i> Agregar Mantención
            </button>
            <div class="text-right text-xs">
              <span v-if="isAdmin" class="inline-block px-2.5 py-1 rounded-full bg-emerald-500 text-slate-950 font-bold shadow-sm whitespace-nowrap">
                <i class="fa-solid fa-user-shield mr-1"></i> {{ usuarioActivo.nombre }} (Admin)
              </span>
              <span v-else class="inline-block px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 font-semibold border border-slate-700 whitespace-nowrap">
                <i class="fa-solid fa-eye mr-1"></i> {{ usuarioActivo.nombre }} (Lectura)
              </span>
            </div>
            <button @click="logout" class="bg-rose-600 hover:bg-rose-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow">
              <i class="fa-solid fa-right-from-bracket"></i> Salir
            </button>
          </div>
        </div>
      </header>

      <main class="max-w-[1400px] mx-auto px-4 py-6 flex-grow w-full">

        <!-- DASHBOARD -->
        <section v-if="currentTab === 'dashboard'" class="space-y-6">
          <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-3">
            <div>
              <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-chart-pie text-emerald-600"></i> Dashboard de Control de Equipos y Estado Operativo
              </h2>
              <p class="text-xs text-slate-500">Haz clic en cualquiera de los bloques para filtrar los equipos en el inventario.</p>
            </div>
            <div class="flex items-center gap-2">
              <button @click="exportarCSV(resumenKPIs, 'Resumen_KPIs_AFI')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition flex items-center gap-1.5 shadow">
                <i class="fa-solid fa-file-excel"></i> Exportar KPIs (CSV)
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3">
            <div @click="filtrarYIrAInventario('ALL')" class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between cursor-pointer hover:border-slate-400 transition">
              <div>
                <p class="text-[10px] text-slate-500 font-bold uppercase">Total Flota</p>
                <h3 class="text-xl font-bold text-slate-800">{{ dbEquipos.length }}</h3>
              </div>
              <div class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center text-sm"><i class="fa-solid fa-truck-monster"></i></div>
            </div>
            <div @click="filtrarYIrAInventario('Operativo')" class="bg-white p-3.5 rounded-xl shadow-sm border border-emerald-200 flex items-center justify-between cursor-pointer hover:border-emerald-500 transition">
              <div>
                <p class="text-[10px] text-slate-500 font-bold uppercase">Trabajando</p>
                <h3 class="text-xl font-bold text-emerald-600">{{ countEstado('Operativo') }}</h3>
              </div>
              <div class="w-8 h-8 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-sm"><i class="fa-solid fa-circle-check"></i></div>
            </div>
            <div @click="filtrarYIrAInventario('Disponible')" class="bg-white p-3.5 rounded-xl shadow-sm border border-sky-200 flex items-center justify-between cursor-pointer hover:border-sky-500 transition">
              <div>
                <p class="text-[10px] text-slate-500 font-bold uppercase">Disponible</p>
                <h3 class="text-xl font-bold text-sky-600">{{ countEstado('Disponible') }}</h3>
              </div>
              <div class="w-8 h-8 rounded-full bg-sky-50 text-sky-600 flex items-center justify-center text-sm"><i class="fa-solid fa-warehouse"></i></div>
            </div>
            <div @click="filtrarYIrAInventario('En Traslado')" class="bg-white p-3.5 rounded-xl shadow-sm border border-amber-200 flex items-center justify-between cursor-pointer hover:border-amber-500 transition">
              <div>
                <p class="text-[10px] text-slate-500 font-bold uppercase">En Traslado</p>
                <h3 class="text-xl font-bold text-amber-600">{{ countEstado('En Traslado') }}</h3>
              </div>
              <div class="w-8 h-8 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center text-sm"><i class="fa-solid fa-truck-moving"></i></div>
            </div>
            <div @click="filtrarYIrAInventario('En Mantencion')" class="bg-white p-3.5 rounded-xl shadow-sm border border-rose-200 flex items-center justify-between cursor-pointer hover:border-rose-500 transition">
              <div>
                <p class="text-[10px] text-slate-500 font-bold uppercase">En Mantención</p>
                <h3 class="text-xl font-bold text-rose-600">{{ countEstado('En Mantencion') }}</h3>
              </div>
              <div class="w-8 h-8 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center text-sm"><i class="fa-solid fa-wrench"></i></div>
            </div>
            <div @click="filtrarYIrAInventario('Fuera de Servicio')" class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-300 flex items-center justify-between cursor-pointer hover:border-slate-600 transition">
              <div>
                <p class="text-[10px] text-slate-500 font-bold uppercase">Fuera Servicio</p>
                <h3 class="text-xl font-bold text-slate-700">{{ countEstado('Fuera de Servicio') }}</h3>
              </div>
              <div class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center text-sm"><i class="fa-solid fa-ban"></i></div>
            </div>
            <div @click="filtrarYIrAInventario('Venta')" class="bg-white p-3.5 rounded-xl shadow-sm border border-purple-200 flex items-center justify-between cursor-pointer hover:border-purple-500 transition">
              <div>
                <p class="text-[10px] text-slate-500 font-bold uppercase">En Venta</p>
                <h3 class="text-xl font-bold text-purple-600">{{ countEstado('Venta') }}</h3>
              </div>
              <div class="w-8 h-8 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center text-sm"><i class="fa-solid fa-hand-holding-dollar"></i></div>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-3">
              <h3 class="text-xs font-bold uppercase text-slate-700 flex items-center gap-2"><i class="fa-solid fa-chart-pie text-emerald-600"></i> Estado Operativo</h3>
              <div class="h-60 relative"><canvas id="chartEstado"></canvas></div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-3">
              <h3 class="text-xs font-bold uppercase text-slate-700 flex items-center gap-2"><i class="fa-solid fa-chart-column text-blue-600"></i> Mantenciones por Tipo</h3>
              <div class="h-60 relative"><canvas id="chartTiposMant"></canvas></div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-3 md:col-span-2 lg:col-span-1">
              <h3 class="text-xs font-bold uppercase text-slate-700 flex items-center gap-2"><i class="fa-solid fa-chart-bar text-amber-600"></i> Causas de Intervención</h3>
              <div class="h-60 relative"><canvas id="chartCausas"></canvas></div>
            </div>
          </div>
        </section>

        <!-- INVENTARIO AFI -->
        <section v-if="currentTab === 'inventario'" class="space-y-4">
          <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-filter text-amber-500"></i> Filtros de Inventario General</h2>
              <div class="flex flex-wrap items-center gap-2">
                <button @click="toggleFiltroCriticos" :class="['text-xs font-extrabold px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow', filterInv.mostrarCriticos ? 'bg-rose-600 text-white animate-pulse' : 'bg-slate-100 text-rose-600 border border-rose-200 hover:bg-rose-50']">
                  <i class="fa-solid fa-triangle-exclamation"></i> {{ filterInv.mostrarCriticos ? 'Viendo Críticos' : 'Ver Equipos Críticos / Pasados' }}
                </button>
                <label class="text-xs font-bold text-slate-700 ml-2">Orden:</label>
                <select v-model="sortInventarioOrder" class="p-1.5 border rounded text-xs font-bold bg-slate-50">
                  <option value="desc">Más Recientes primero</option>
                  <option value="asc">Más Antiguos primero</option>
                </select>
                <button @click="resetFiltrosInventario" class="text-xs text-slate-500 hover:text-slate-800 underline mx-2">Limpiar</button>
                <button @click="exportarCSV(filteredEquipos, 'Inventario_AFI_Filtrado')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition shadow"><i class="fa-solid fa-file-excel"></i> CSV</button>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 text-xs">
              <div>
                <label class="block font-bold text-slate-700 mb-1">Buscar (AFI / Tipo / Marca)</label>
                <input type="text" v-model="filterInv.search" placeholder="Ej: Generador..." class="w-full p-2 border border-slate-300 rounded-lg">
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">Ubicación</label>
                <input type="text" v-model="filterInv.ubicacion" placeholder="Ej: Tierras Blancas" class="w-full p-2 border border-slate-300 rounded-lg">
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">Estado</label>
                <select v-model="filterInv.estado" class="w-full p-2 border border-slate-300 rounded-lg font-semibold">
                  <option value="ALL">-- Todos --</option>
                  <option value="Operativo">Trabajando / Operativo</option>
                  <option value="Disponible">Disponible</option>
                  <option value="En Traslado">En Traslado</option>
                  <option value="En Mantencion">En Mantención</option>
                  <option value="Fuera de Servicio">Fuera de Servicio</option>
                  <option value="Venta">En Venta</option>
                </select>
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">GPS</label>
                <select v-model="filterInv.gps" class="w-full p-2 border border-slate-300 rounded-lg">
                  <option value="ALL">-- Todos --</option>
                  <option value="Instalado">Instalado</option>
                  <option value="Sin GPS">Sin GPS</option>
                </select>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div v-for="e in filteredEquipos" :key="e.id" class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col justify-between">
              <div>
                <div class="relative h-44 bg-slate-900 group">
                  <img :src="e.foto || 'https://via.placeholder.com/300x180/0f172a/ffffff?text=' + e.afi" class="w-full h-full object-cover">
                  <span :class="['absolute top-2 right-2 px-2.5 py-1 rounded-md text-[10px] font-bold shadow-md', getBadgeClass(e.disponibilidad)]">
                    {{ getEstadoText(e.disponibilidad) }}
                  </span>
                  <label v-if="isAdmin" class="absolute bottom-2 right-2 bg-slate-900/80 hover:bg-slate-900 text-white p-1.5 rounded-lg text-xs cursor-pointer shadow flex items-center gap-1">
                    <i class="fa-solid fa-camera"></i> <span>Subir Foto</span>
                    <input type="file" @change="uploadFotoEquipo($event, e)" accept="image/*" class="hidden">
                  </label>
                </div>
                <div class="p-4 space-y-3">
                  <div class="flex justify-between items-start">
                    <div>
                      <span class="text-xs font-mono font-bold text-amber-700 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded">AFI: {{ e.afi }}</span>
                      <h3 class="font-bold text-sm text-slate-800 mt-1">{{ e.tipo }}</h3>
                    </div>
                  </div>
                  <div class="text-xs space-y-1 text-slate-600">
                    <p><i class="fa-solid fa-industry w-4 text-slate-400"></i> <strong>Marca/Modelo:</strong> {{ e.marca }} {{ e.modelo }}</p>
                    <p><i class="fa-solid fa-location-dot w-4 text-rose-500"></i> <strong>Ubicación:</strong> <span class="font-semibold text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded">{{ e.ubicacion }}</span></p>
                  </div>

                  <div :class="['rounded-xl p-3 space-y-2 text-xs border', getHorometroCardBgClass(e.horometros)]">
                    
                    <div class="flex justify-between items-center text-[10px] text-slate-500 font-bold border-b pb-1">
                      <span class="text-amber-700"><i class="fa-solid fa-stopwatch"></i> FRECUENCIA: {{ e.frecuenciaMantencion }}h</span>
                      <span class="text-blue-700"><i class="fa-solid fa-chart-line"></i> USO DIARIO: {{ e.horometros?.rateHrsDia > 0 ? e.horometros.rateHrsDia.toFixed(1) + ' hrs/día' : 'Sin datos' }}</span>
                    </div>

                    <div class="flex justify-between items-center font-bold">
                      <span><i class="fa-solid fa-gauge-high text-amber-600"></i> Proyección de Horómetros:</span>
                      <span :class="['px-2 py-0.5 rounded text-[10px] font-bold uppercase', getPrediccionStatusBadge(e.horometros)]">
                        {{ e.horometros?.estadoTexto || 'OK' }}
                      </span>
                    </div>
                    <div class="grid grid-cols-3 gap-1.5 text-center text-[10px]">
                      <div class="bg-white/80 p-1.5 rounded border">
                        <span class="text-slate-500 font-bold block" title="Guardado manualmente en el perfil del equipo">MANUAL</span>
                        <strong class="font-mono text-slate-800">{{ e.horometros?.hOficial || 0 }}h</strong>
                      </div>
                      <div class="bg-white/80 p-1.5 rounded border">
                        <span class="text-slate-500 font-bold block" title="Cálculo del horómetro al día de hoy según tasa de uso">APROX HOY</span>
                        <strong class="font-mono text-blue-700">{{ e.horometros?.hAprox || 0 }}h</strong>
                      </div>
                      <div class="bg-white/80 p-1.5 rounded border">
                        <span class="text-slate-500 font-bold block" title="Última mantención + Frecuencia">META / TGT</span>
                        <strong class="font-mono text-emerald-700">{{ e.horometros?.hTarget || 0 }}h</strong>
                      </div>
                    </div>
                    <div class="text-[11px] font-medium text-slate-700 pt-1 text-center bg-white/60 p-1 rounded">
                      <i class="fa-solid fa-calendar-days text-amber-600 mr-1"></i> Fecha aprox. mantención: <strong>{{ e.horometros?.fechaEstimada || '-' }}</strong>
                    </div>
                  </div>
                </div>
              </div>

            if (filterOil.value.afi !== "ALL" && String(i.afi).trim().toUpperCase() !== String(filterOil.value.afi).trim().toUpperCase()) return false;
            if (filterOil.value.tipoAceite !== "ALL" && !i.aceiteDetallesArray.some(ad => ad.nombre === filterOil.value.tipoAceite)) return false;
            const fStr = formatExcelDate(i.fecha);
            if (filterOil.value.dateStart && fStr < filterOil.value.dateStart) return false;
            if (filterOil.value.dateEnd && fStr > filterOil.value.dateEnd) return false;
            return true;
          });
          arr.sort((a, b) => sortAceitesOrder.value === 'desc' ? parseIsoDate(b.fecha) - parseIsoDate(a.fecha) : parseIsoDate(a.fecha) - parseIsoDate(b.fecha));
          return arr;
        });

        const sumaTotalCantidadAceites = computed(() => {
          let suma = 0;
          filteredAceitesRecords.value.forEach(i => {
            if (i.aceiteDetallesArray) {
              i.aceiteDetallesArray.forEach(ad => {
                if (filterOil.value.tipoAceite === "ALL" || ad.nombre === filterOil.value.tipoAceite) suma += Number(ad.cantidad || 0);
              });
            }
          });
          return suma;
        });
        const costoTotalAceitesFiltrados = computed(() => filteredAceitesRecords.value.reduce((acc, curr) => acc + Number(curr.costo || 0), 0));

        // CRUD y Formularios Mantenimiento
        const abrirFormularioNuevaMantencion = (afiInicial = "") => {
          isEditingMantencion.value = false;
          formMant.value = {
            id: null, afi: afiInicial || (dbEquipos.value.length > 0 ? dbEquipos.value[0].afi : ""),
            fecha: new Date().toISOString().substring(0, 10), lugar: "", causa: "MANTENCION", tipoMant: "PREVENTIVA", tipoHorasMant: "250 hrs",
            horometro: "", mec1: "", mec2: "", mec3: "", mec4: "", horaInicio: "", horaTermino: "", causaDetallada: "", descripcion: "", interferencia: "", empresaArriendo: "",
            costo: 0, numeroOC: "", numeroOT: "", aceiteDetallesArray: [], documentoAdjunto: null
          };
          showFormMantencionModal.value = true;
        };

        const editarMantencion = (item) => {
          isEditingMantencion.value = true;
          formMant.value = JSON.parse(JSON.stringify(item));
          if (!formMant.value.aceiteDetallesArray) formMant.value.aceiteDetallesArray = [];
          showFormMantencionModal.value = true;
        };

        const eliminarMantencion = async (id) => {
          if (confirm("¿Eliminar registro de mantención?")) {
            await supabaseClient.from('BD_HISTORIAL').delete().eq('id', id);
            await cargarDatosDesdeSupabase();
          }
        };

        const agregarFilaAceiteForm = () => { formMant.value.aceiteDetallesArray.push({ nombre: "", cantidad: "" }); };
        const eliminarFilaAceiteForm = (index) => { formMant.value.aceiteDetallesArray.splice(index, 1); };

        const guardarMantencionForm = async () => {
          const payload = {
            afi: formMant.value.afi, fecha: formatIsoDateForSupabase(formMant.value.fecha), lugar: formMant.value.lugar, causa: formMant.value.causa,
            tipo_mantencion: formMant.value.tipoMant, tipo_horas_mantencion: formMant.value.tipoHorasMant, horometro: parseNum(formMant.value.horometro),
            mecanico_1: formMant.value.mec1, mecanico_2: formMant.value.mec2, mecanico_3: formMant.value.mec3, mecanico_4: formMant.value.mec4,
            hora_inicio: formMant.value.horaInicio, hora_termino: formMant.value.horaTermino, causa_intervencion: formMant.value.causaDetallada, descripcion: formMant.value.descripcion,
            interferencia: formMant.value.interferencia, empresa: formMant.value.empresaArriendo, costo: parseNum(formMant.value.costo), numero_oc: formMant.value.numeroOC, numero_ot: formMant.value.numeroOT
          };
          if (isEditingMantencion.value && formMant.value.id) await supabaseClient.from('BD_HISTORIAL').update(payload).eq('id', formMant.value.id);
          else await supabaseClient.from('BD_HISTORIAL').insert([payload]);
          await cargarDatosDesdeSupabase();
          showFormMantencionModal.value = false;
          alert("Mantención guardada en Supabase.");
        };

        // Utilidades de Perfil de Equipo
        const abrirPerfilEquipo = (equipo) => {
          perfilEquipo.value = JSON.parse(JSON.stringify(equipo));
          showPerfilEquipoModal.value = true;
        };

        const verDetallePorAfiString = (afiStr) => {
          const eq = dbEquipos.value.find(e => String(e.afi).trim().toUpperCase() === String(afiStr).trim().toUpperCase());
          if (eq) abrirPerfilEquipo(eq);
        };

        const guardarPerfilEquipo = async () => {
          const payload = {
            tipo: perfilEquipo.value.tipo, marca: perfilEquipo.value.marca, modelo: perfilEquipo.value.modelo, ubicacion: perfilEquipo.value.ubicacion,
            disponibilidad: perfilEquipo.value.disponibilidad, gps: perfilEquipo.value.gps, imei_gps: perfilEquipo.value.imei_gps,
            horometroactual: parseNum(perfilEquipo.value.horometroActual) || 0, frecuencia_mantencion: parseNum(perfilEquipo.value.frecuenciaMantencion) || 250
          };
          const { error } = await supabaseClient.from('BD_INVENTARIO').update(payload).eq('id', perfilEquipo.value.id);
          if (error) alert("Error al guardar en Supabase: " + error.message);
          else { await cargarDatosDesdeSupabase(); showPerfilEquipoModal.value = false; alert("¡Perfil guardado correctamente!"); }
        };

        const getHistorialIntervencionesAFI = (afi) => dbIntervenciones.value.filter(i=>String(i.afi).trim().toUpperCase()===String(afi).trim().toUpperCase()).slice(0,10);
        const getHistorialMovimientosAFI = (afi) => dbMovimientos.value.filter(m=>String(m.afi).trim().toUpperCase()===String(afi).trim().toUpperCase()).slice(0,10);

        // Importación Masiva Excel (Igual al anterior)
        const normalizeKey = (str) => String(str || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
        const getVal = (row, ...keys) => {
          if (!row) return "";
          const rowKeys = Object.keys(row);
          for (const k of keys) {
            const tk = normalizeKey(k);
            const fk = rowKeys.find(rk => normalizeKey(rk) === tk);
            if (fk && row[fk] !== undefined && row[fk] !== null && String(row[fk]).trim() !== "") return row[fk];
          }
          return "";
        };

        const parseFileAnyFormat = (file) => {
          return new Promise((resolve, reject) => {
            const fileName = file.name.toLowerCase();
            const reader = new FileReader();
            if (fileName.endsWith('.json')) {
              reader.onload = (evt) => { try { resolve(JSON.parse(evt.target.result)); } catch (e) { reject("JSON error"); } };
              reader.readAsText(file);
            } else {
              reader.onload = (evt) => {
                try {
                  const data = new Uint8Array(evt.target.result);
                  const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                  resolve(XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "", raw: false }));
                } catch (e) { reject("Excel error"); }
              };
              reader.readAsArrayBuffer(file);
            }
          });
        };

        const importarInventarioFile = async (e) => {
          const file = e.target.files[0]; if (!file) return;
          try {
            const rows = await parseFileAnyFormat(file);
            const payloads = rows.map(item => {
              const rawAfi = getVal(item, "afi", "codigo afi", "n° afi");
              if (!rawAfi) return null;
              return {
                afi: String(rawAfi).trim(), tipo: parseStr(getVal(item, "tipo", "equipo")), marca: parseStr(getVal(item, "marca")), modelo: parseStr(getVal(item, "modelo")),
                n_serie: parseStr(getVal(item, "n° serie", "n_serie", "serie", "nserie")), anio: parseNum(getVal(item, "año", "ano", "anio")), ubicacion: parseStr(getVal(item, "ubicación", "ubicacion", "planta")),
                contrato: parseStr(getVal(item, "contrato")), empresa: parseStr(getVal(item, "empresa")), disponibilidad: normalizarClave(getVal(item, "disponibilidad", "estado") || "Operativo"),
                gps: parseStr(getVal(item, "gps")) || "Sin GPS", imei_gps: parseStr(getVal(item, "imei gps", "imei_gps", "imeigps")),
                horometroactual: parseNum(getVal(item, "hor", "horometro", "horometro actual", "horometroactual")) || 0, frecuencia_mantencion: 250
              };
            }).filter(Boolean);
            if (payloads.length === 0) return alert("No se encontraron filas válidas.");
            const { error } = await supabaseClient.from('BD_INVENTARIO').upsert(payloads, { onConflict: 'afi' });
            if (error) return alert("Error Supabase: " + error.message);
            await cargarDatosDesdeSupabase(); alert(`¡Importados ${payloads.length} equipos!`);
          } catch (err) { alert("Error al procesar el archivo."); }
        };

        const importarMovimientosFile = async (e) => {
          const file = e.target.files[0]; if (!file) return;
          try {
            const rows = await parseFileAnyFormat(file);
            const payloads = rows.map(item => {
              const rawAfi = getVal(item, "afi", "codigo afi");
              if (!rawAfi) return null;
              return {
                afi: String(rawAfi).trim(), fecha: formatIsoDateForSupabase(getVal(item, "fecha")), tipo: parseStr(getVal(item, "tipo")), marca: parseStr(getVal(item, "marca")),
                modelo: parseStr(getVal(item, "modelo")), ubicacion_anterior: parseStr(getVal(item, "ubicación anterior", "origen")), empresa_arriendo: parseStr(getVal(item, "empresa arriendo")),
                estado: parseStr(getVal(item, "estado")), ubicacion_actual: parseStr(getVal(item, "ubicación actual", "destino")), camion_encargado: parseStr(getVal(item, "camión encargado", "camion")),
                conductor_encargado: parseStr(getVal(item, "conductor encargado", "conductor"))
              };
            }).filter(Boolean);
            if (payloads.length === 0) return alert("Sin registros válidos.");
            await supabaseClient.from('BD_MOVIMIENTOS').insert(payloads);
            await cargarDatosDesdeSupabase(); alert(`¡Importados ${payloads.length} movimientos!`);
          } catch (err) { alert("Error al importar movimientos."); }
        };

        const importarIntervencionesFile = async (e) => {
          const file = e.target.files[0]; if (!file) return;
          try {
            const rows = await parseFileAnyFormat(file);
            const payloads = rows.map(item => {
              const rawAfi = getVal(item, "afi", "codigo afi", "n° afi");
              if (!rawAfi) return null;
              return {
                afi: String(rawAfi).trim(), fecha: formatIsoDateForSupabase(getVal(item, "fecha")), equipo: parseStr(getVal(item, "equipo", "tipo equipo")), lugar: parseStr(getVal(item, "lugar", "ubicacion")),
                tipo_documento: parseStr(getVal(item, "tipo documento", "tipo_documento")), causa: parseStr(getVal(item, "causa")), tipo_mantencion: parseStr(getVal(item, "tipo mantencion", "tipo_mantencion")),
                tipo_horas_mantencion: parseStr(getVal(item, "tipo en horas mantencion", "tipo_horas_mantencion", "tipo horas")), horometro: parseNum(getVal(item, "horometro")),
                mecanico_1: parseStr(getVal(item, "mecanico 1", "mecanico_1")), mecanico_2: parseStr(getVal(item, "mecanico 2", "mecanico_2")), mecanico_3: parseStr(getVal(item, "mecanico 3", "mecanico_3")), mecanico_4: parseStr(getVal(item, "mecanico 4", "mecanico_4")),
                uso_de_art: parseStr(getVal(item, "uso de art", "uso_de_art")), bloqueo_de_equipo: parseStr(getVal(item, "bloqueo de equipo", "bloqueo_de_equipo")),
                hora_falla: parseStr(getVal(item, "hora falla", "hora_falla")), hora_inicio: parseStr(getVal(item, "hora inicio", "hora_inicio")), hora_termino: parseStr(getVal(item, "hora termino", "hora_termino")), hora_total: parseStr(getVal(item, "hora total", "hora_total")),
                causa_intervencion: parseStr(getVal(item, "causa de la intervencion", "causa_intervencion", "causa detallada")), descripcion: parseStr(getVal(item, "descripcion")), interferencia: parseStr(getVal(item, "interferencia")),
                empresa: parseStr(getVal(item, "empresa")), link: parseStr(getVal(item, "link")), kit_bodega: parseStr(getVal(item, "kit bodega", "kit_bodega")), costo: parseNum(getVal(item, "costo")), numero_oc: parseStr(getVal(item, "n° oc", "numero_oc", "oc")), numero_ot: parseStr(getVal(item, "n° ot", "numero_ot", "ot")),
                aceite_15w40_ci4: parseNum(getVal(item, "aceite 15w40 ci-4", "aceite_15w40_ci4")), aceite_15w40_ck4: parseNum(getVal(item, "aceite 15w40 ck4", "aceite_15w40_ck4")), aceite_refrigerante_5050: parseNum(getVal(item, "aceite refrigerante 50/50", "aceite_refrigerante_5050")),
                aceite_80w90: parseNum(getVal(item, "aceite 80w90", "aceite_80w90")), aceite_dacnis_68: parseNum(getVal(item, "aceite dacnis 68", "aceite_dacnis_68")), aceite_dacnis_46: parseNum(getVal(item, "aceite dacnis 46", "aceite_dacnis_46")),
                paroil_m_extreme: parseNum(getVal(item, "paroil m extreme", "paroil_m_extreme")), paroil_s_extreme: parseNum(getVal(item, "paroil s extreme", "paroil_s_extreme")), aceite_5w30: parseNum(getVal(item, "5w30", "aceite_5w30")),
                liquido_freno_dot4: parseNum(getVal(item, "liquido de freno dot-4", "liquido_freno_dot4")), tractofluid_10w30: parseNum(getVal(item, "tractofluid (10w30)", "tractofluid_10w30")), sae_30: parseNum(getVal(item, "sae 30", "sae_30")),
                hydra46: parseNum(getVal(item, "hydra46")), hydra_68: parseNum(getVal(item, "hydra 68", "hydra_68")), adblue: parseNum(getVal(item, "adblue")), aceite_75w90: parseNum(getVal(item, "aceite 75w90", "aceite_75w90")),
                aceite_10w40: parseNum(getVal(item, "aceite 10w40", "aceite_10w40")), multiproposito: parseNum(getVal(item, "multiproposito")), desegransante: parseNum(getVal(item, "desegransante")), acido_muriatico: parseNum(getVal(item, "acido muriatico", "acido_muriatico"))
              };
            }).filter(Boolean);
            if (payloads.length === 0) return alert("No se encontraron registros válidos.");
            const BATCH = 200;
            for (let i=0; i<payloads.length; i+=BATCH) await supabaseClient.from('BD_HISTORIAL').insert(payloads.slice(i, i+BATCH));
            await cargarDatosDesdeSupabase(); alert(`¡Importados ${payloads.length} registros!`);
          } catch (err) { alert("Error al procesar el archivo Excel."); }
        };

        const exportarCSV = (dataArray, filename = 'Export') => {
          if (!dataArray || !dataArray.length) return alert("Sin datos.");
          const headers = Object.keys(dataArray[0]);
          const csvRows = [headers.join(';')];
          for (const row of dataArray) {
            csvRows.push(headers.map(h => `"${('' + (row[h] ?? '')).replace(/"/g, '""')}"`).join(';'));
          }
          const blob = new Blob(['\uFEFF' + csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
          const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `${filename}_${new Date().toISOString().substring(0,10)}.csv`; link.click();
        };

        const cargarUsuariosDesdeSupabase = async () => {
          try {
            const { data } = await supabaseClient.from('usuarios').select('*');
            if (data && data.length > 0) dbUsuarios.value = data;
            else dbUsuarios.value = [{ usuario: "logistica", clave: "frc", rol: "admin", nombre: "Logística FRC" }];
          } catch (err) { console.error("Error usuarios:", err); }
        };
        const crearNuevoUsuario = async () => {
          if (!nuevoUsuario.value.usuario || !nuevoUsuario.value.clave) return alert("Completa usuario y clave.");
          const { error } = await supabaseClient.from('usuarios').insert([{ usuario: nuevoUsuario.value.usuario.trim(), clave: nuevoUsuario.value.clave.trim(), rol: nuevoUsuario.value.rol, nombre: nuevoUsuario.value.usuario.trim() }]);
          if (!error) { await cargarUsuariosDesdeSupabase(); nuevoUsuario.value = { usuario: "", clave: "", rol: "lectura" }; alert("¡Usuario guardado!"); }
        };
        const eliminarUsuario = async (username) => {
          if (confirm(`¿Eliminar al usuario ${username}?`)) {
            const { error } = await supabaseClient.from('usuarios').delete().eq('usuario', username);
            if (!error) { await cargarUsuariosDesdeSupabase(); alert("Usuario eliminado correctamente."); }
          }
        };

        let chartEstadoInst=null, chartTiposInst=null, chartCausasInst=null;
        const renderCharts = () => {
          if (currentTab.value !== 'dashboard' || !usuarioActivo.value) return;
          nextTick(() => {
            const ctx1 = document.getElementById('chartEstado');
            if (ctx1) {
              if (chartEstadoInst) chartEstadoInst.destroy();
              chartEstadoInst = new Chart(ctx1, {
                type: 'doughnut', data: { labels: ['Trabajando', 'Disponibles', 'En Traslado', 'En Mantención', 'Fuera de Servicio', 'Venta'], datasets: [{ data: [countEstado('Operativo'), countEstado('Disponible'), countEstado('En Traslado'), countEstado('En Mantencion'), countEstado('Fuera de Servicio'), countEstado('Venta')], backgroundColor: ['#10b981', '#0284c7', '#f59e0b', '#f43f5e', '#64748b', '#a855f7'] }] }, options: { responsive: true, maintainAspectRatio: false }
              });
            }
            const ctx2 = document.getElementById('chartTiposMant');
            if (ctx2) {
              if (chartTiposInst) chartTiposInst.destroy();
              chartTiposInst = new Chart(ctx2, {
                type: 'bar', data: { labels: ['Preventiva', 'Predictiva', 'Correctiva'], datasets: [{ data: [ dbIntervenciones.value.filter(i => String(i.tipoMant).toUpperCase().includes('PREVENT')).length, dbIntervenciones.value.filter(i => String(i.tipoMant).toUpperCase().includes('PREDICT')).length, dbIntervenciones.value.filter(i => String(i.tipoMant).toUpperCase().includes('CORRECT')).length ], backgroundColor: ['#2563eb', '#8b5cf6', '#dc2626'] }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
              });
            }
            const ctx3 = document.getElementById('chartCausas');
            if (ctx3) {
              if (chartCausasInst) chartCausasInst.destroy();
              const causasMap = {}; dbIntervenciones.value.forEach(i => { if (i.causa) causasMap[i.causa] = (causasMap[i.causa] || 0) + 1; });
              chartCausasInst = new Chart(ctx3, {
                type: 'bar', data: { labels: Object.keys(causasMap).slice(0, 6), datasets: [{ data: Object.values(causasMap).slice(0, 6), backgroundColor: '#f59e0b' }] }, options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
              });
            }
          });
        };

        const switchTab = (tab) => { currentTab.value = tab; if (tab === 'dashboard') renderCharts(); };
        const countEstado = (st) => dbEquipos.value.filter(e => normalizarClave(e.disponibilidad) === normalizarClave(st)).length;
        const getEstadoText = (est) => {
          const norm = normalizarClave(est);
          if (norm === 'Operativo') return 'Trabajando / Operativo'; if (norm === 'Disponible') return 'Disponible';
          if (norm === 'En Traslado') return 'En Traslado'; if (norm === 'En Mantencion') return 'En Mantención';
          if (norm === 'Fuera de Servicio') return 'Fuera de servicio'; if (norm === 'Venta') return 'En Venta';
          return est || '-';
        };
        const getBadgeClass = (est) => {
          const norm = normalizarClave(est);
          if (norm === 'Operativo') return 'bg-emerald-100 text-emerald-800 border'; if (norm === 'Disponible') return 'bg-sky-100 text-sky-800 border';
          if (norm === 'En Traslado') return 'bg-amber-100 text-amber-800 border'; if (norm === 'En Mantencion') return 'bg-rose-100 text-rose-800 border';
          return 'bg-slate-100 text-slate-700 border';
        };
        const filtrarYIrAInventario = (estado) => { filterInv.value.estado = estado; currentTab.value = 'inventario'; };
        const resumenKPIs = computed(() => [ { Metrica: "Total Flota AFI", Valor: dbEquipos.value.length }, { Metrica: "Operativos", Valor: countEstado('Operativo') }, { Metrica: "Disponibles", Valor: countEstado('Disponible') } ]);

        onMounted(async () => {
          const cfgSaved = localStorage.getItem('afi_config_custom'); if (cfgSaved) config.value = JSON.parse(cfgSaved);
          await cargarUsuariosDesdeSupabase(); await cargarDatosDesdeSupabase();
        });

        const login = () => {
          const userEncontrado = dbUsuarios.value.find(u => u.usuario.toLowerCase() === loginUser.value.trim().toLowerCase() && u.clave === loginPass.value.trim());
          if (userEncontrado) { usuarioActivo.value = userEncontrado; authError.value = false; loginUser.value = ""; loginPass.value = ""; nextTick(() => renderCharts()); }
          else authError.value = true;
        };
        const logout = () => { usuarioActivo.value = null; };

        return {
          usuarioActivo, isAdmin, loginUser, loginPass, authError, currentTab, switchTab, dbUsuarios, nuevoUsuario, crearNuevoUsuario, eliminarUsuario,
          config, headerStyle, bodyStyle, primaryBtnStyle, guardarConfiguracionPersonalizada, subirNuevaFotoLogo, uploadFotoEquipo,
          listaCausas, listaAceitesEstandar, dbEquipos, dbMovimientos, dbIntervenciones, dbProgramas, countEstado, resumenKPIs, filterInv, filterMov, filterInt, filterOil,
          sortInventarioOrder, sortMovimientosOrder, sortHistorialOrder, sortAceitesOrder, resetFiltrosInventario, limpiarFiltrosHistorial, limpiarFiltrosMovimientos,
          filtrarYIrAInventario, verDetallePorAfiString, getEstadoText, getBadgeClass, filteredEquipos, filteredMovimientos, filteredIntervenciones, filteredAceitesRecords,
          listaTiposAceitesDisponibles, sumaTotalCantidadAceites, costoTotalAceitesFiltrados, exportarCSV, importarInventarioFile, importarMovimientosFile, importarIntervencionesFile,
          getHistorialMovimientosAFI, getHistorialIntervencionesAFI, getMecanicosText, calcularRestaHoras,
          showPerfilEquipoModal, perfilEquipo, abrirPerfilEquipo, guardarPerfilEquipo,
          showFormMantencionModal, isEditingMantencion, formMant, abrirFormularioNuevaMantencion, editarMantencion, eliminarMantencion, agregarFilaAceiteForm, eliminarFilaAceiteForm, guardarMantencionForm,
          getHorometroCardBgClass, getPrediccionStatusBadge, login, logout, renderCharts,
          showNuevoProgramaModal, formPrograma, abrirFormularioPrograma, guardarNuevoPrograma, listaCarpetasProgramas, mesesSugeridos, obtenerMesesDeCarpeta, obtenerItemsPrograma, getProgreso, openFolders, toggleFolder, progSelect, seleccionarPrograma, marcarProgramaRealizado, eliminarItemPrograma,
          perfilAsignacionProg, guardarAsignacionDesdePerfil, toggleFiltroCriticos
        };
      }
    }).mount('#app');
  </script>
</body>
