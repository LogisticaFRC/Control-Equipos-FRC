<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control AFI & Programación</title>
  <!-- Favicon: logo de la empresa (main.js lo cambia si se sube otro logo en Config & Usuarios) -->
  <link rel="icon" id="favicon" type="image/png" href="https://i.imgur.com/J9QQiUc.png">
  <link rel="apple-touch-icon" href="https://i.imgur.com/J9QQiUc.png">

  <!-- Tailwind CSS (Play CDN, versión fija) -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Librerías (versiones fijas) -->
  <script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <!-- SheetJS 0.20.3 (la 0.18.5 de npm tiene vulnerabilidades conocidas al abrir Excel) -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <!-- JSZip: rellena la plantilla Excel de la OT sin perder su formato -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="font-sans min-h-screen flex flex-col transition-colors duration-300" style="background-color:#f1f5f9">
  <!-- Toda la aplicación se monta aquí (ver js/main.js) -->
  <div id="app" class="flex-grow flex flex-col"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
